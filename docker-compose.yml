services:
  mysql:
    image: mysql:8.4
    container_name: streamapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: streamapp
      MYSQL_USER: streamapp
      MYSQL_PASSWORD: streamapp
    ports:
      - "3306:3306"
    volumes:
      - streamapp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  streamapp-mysql-data: