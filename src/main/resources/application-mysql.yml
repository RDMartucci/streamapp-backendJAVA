spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/streamapp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:streamapp}
    password: ${DB_PASSWORD:streamapp}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  media:
    root: ${MEDIA_ROOT:./media}